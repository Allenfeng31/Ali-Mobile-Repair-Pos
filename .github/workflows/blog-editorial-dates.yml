name: Blog editorial dates
on:
  pull_request:
  push:
    branches: [main]
jobs:
  dates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify changed Blog dates
        run: node scripts/blog-editorial-dates.mjs --check --base "$BLOG_BASE"
        env:
          BLOG_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
